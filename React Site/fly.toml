# fly.toml app configuration file generated for page-creator-frontend on 2026-07-05T18:05:21+10:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'page-creator-frontend'
primary_region = 'syd'

[build]

[build.args]
  VITE_API_URL = "https://page-creator-backend.fly.dev/"
  VITE_SECRET = "SecretPageMakerCode"


[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
